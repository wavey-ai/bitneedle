[package]
name = "record-decode"
version = "0.1.6"
edition = "2021"
description = "decoder for bitneedle picture records"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license = "Apache-2.0"

[dev-dependencies]
anyhow = "1"
png = "0.17"
sha2 = "0.10"

[dependencies]
bytes2rgb = { path = "../bytes2rgb", version = "0.1.6" }
record-descriptor = { path = "../record-descriptor", version = "0.1.6" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
record-core = { path = "../record-core", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
