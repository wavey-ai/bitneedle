[package]
name = "record-decode"
version = "0.1.7"
edition = "2021"
description = "decoder for bitneedle picture records"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license = "Apache-2.0"

[features]
default = []
# The formats a pressed record can be read back from.
#
# A record is not a picture of data: every groove pixel carries payload, so
# only a format that returns all four channels of every pixel exactly can be
# read at all. PNG is not a feature — it is what the press writes, and this
# crate exists to read what the press writes. The rest are here because a
# record exported as one of them is still a record, and a reader that cannot
# read what the exporter writes is not a reader.
#
# Each one costs binary size, so a build takes only the formats it will see.
tiff = ["image/tiff"]
bmp = ["image/bmp"]
qoi = ["image/qoi"]
webp = ["image/webp"]
tga = ["image/tga"]
pnm = ["image/pnm"]
# The raw sidecar: the magic, the width, the height, then the pixels.
rgba = []
all-formats = ["tiff", "bmp", "qoi", "webp", "tga", "pnm", "rgba"]

[dev-dependencies]
anyhow = "1"
png = "0.17"
sha2 = "0.10"

[dependencies]
bytes2rgb = { path = "../bytes2rgb", version = "0.1.7" }
record-descriptor = { path = "../record-descriptor", version = "0.1.7" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
record-core = { path = "../record-core", version = "0.1.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
