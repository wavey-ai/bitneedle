[package]
name = "bitneedle-id"
version = "0.1.3"
edition = "2021"
license = "CC0-1.0"
description = "Typed prefixed ULID identifiers for Bitneedle public record objects"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ulid = "1.2"

[dev-dependencies]
serde_json = "1"
