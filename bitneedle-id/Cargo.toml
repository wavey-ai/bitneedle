[package]
name = "bitneedle-id"
version = "0.1.5"
edition = "2021"
license = "CC0-1.0"
description = "Typed prefixed ULID identifiers for Bitneedle public record objects"

[features]
default = []
generate = ["dep:rand_core", "ulid/std"]

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ulid = { version = "1.2", default-features = false }

[dev-dependencies]
serde_json = "1"
