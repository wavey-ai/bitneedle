[package]
name = "bitneedle-id"
version = "0.1.4"
edition = "2021"
license = "CC0-1.0"
description = "Typed prefixed ULID identifiers for Bitneedle public record objects"

[features]
default = ["generate"]
generate = ["ulid/std"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ulid = { version = "1.2", default-features = false }

[dev-dependencies]
serde_json = "1"
