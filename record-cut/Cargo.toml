[package]
name = "record-cut"
version = "0.1.6"
edition = "2021"
description = "Canonical Bitneedle record-stream authoring and encoding helpers"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
anyhow = "1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
  "alloc",
] }
record-core = { path = "../record-core", version = "0.1.6" }
record-descriptor = { path = "../record-descriptor", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
