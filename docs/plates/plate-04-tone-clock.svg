<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24,0 H0 V24" fill="none" stroke="#201A15" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#201A15"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#F7F2E7"/>
  <rect x="0" y="0" width="960" height="560" fill="url(#grid4)"/>
  <rect x="8" y="8" width="944" height="544" fill="none" stroke="#201A15" stroke-width="2"/>
  <rect x="16" y="16" width="928" height="528" fill="none" stroke="#201A15" stroke-width="0.75"/>

  <text x="40" y="54" font-family="'Courier New', monospace" font-size="12" letter-spacing="4" fill="#201A15">PLATE IV</text>
  <text x="40" y="82" font-size="26" fill="#201A15">THE TONE CLOCK</text>
  <text x="920" y="54" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#201A15">HOUSE WHEEL · [8 · 16]</text>
  <line x1="40" y1="94" x2="920" y2="94" stroke="#201A15" stroke-width="0.75"/>
  <text x="40" y="114" font-size="14" font-style="italic" fill="#201A15">The wheel is the artwork, quantized — each pocket takes its colour from the art it covers.</text>

  <!-- WHEEL -->
  <g fill="none" stroke-width="45">
    <circle cx="250" cy="300" r="117.5" stroke="#D9A05B" stroke-dasharray="44.6 693.67" stroke-dashoffset="0" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#C96F4A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-46.14" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#B65A63" stroke-dasharray="44.6 693.67" stroke-dashoffset="-92.28" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#9A5F7E" stroke-dasharray="44.6 693.67" stroke-dashoffset="-138.42" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#6F5F8E" stroke-dasharray="44.6 693.67" stroke-dashoffset="-184.56" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#4E6E8E" stroke-dasharray="44.6 693.67" stroke-dashoffset="-230.7" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#4A8E8A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-276.84" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#5FA06A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-322.98" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#8AA653" stroke-dasharray="44.6 693.67" stroke-dashoffset="-369.12" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#D9C05B" stroke-dasharray="44.6 693.67" stroke-dashoffset="-415.26" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#C98D4A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-461.42" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#A86A5A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-507.56" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#7E6A8E" stroke-dasharray="44.6 693.67" stroke-dashoffset="-553.7" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#5A7E9A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-599.84" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#6A9A8E" stroke-dasharray="44.6 693.67" stroke-dashoffset="-645.98" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="117.5" stroke="#B68A4A" stroke-dasharray="44.6 693.67" stroke-dashoffset="-692.12" transform="rotate(-90 250 300)"/>
  </g>
  <g fill="none" stroke-width="43">
    <circle cx="250" cy="300" r="73.5" stroke="#7A4A3A" stroke-dasharray="56.2 405.61" stroke-dashoffset="0" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#3A6A5A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-57.73" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#4A5A7A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-115.46" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#8A6A3A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-173.19" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#5A3A5A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-230.9" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#3A7A6A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-288.63" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#A05A4A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-346.35" transform="rotate(-90 250 300)"/>
    <circle cx="250" cy="300" r="73.5" stroke="#4A8A5A" stroke-dasharray="56.2 405.61" stroke-dashoffset="-404.08" transform="rotate(-90 250 300)"/>
  </g>
  <circle cx="250" cy="300" r="140" fill="none" stroke="#201A15" stroke-width="2"/>
  <circle cx="250" cy="300" r="52" fill="#14110E" stroke="#201A15" stroke-width="1.5"/>
  <text x="250" y="294" text-anchor="middle" font-size="11" letter-spacing="3" fill="#F7F2E7">HOUSE</text>
  <text x="250" y="309" text-anchor="middle" font-size="11" letter-spacing="3" fill="#F7F2E7">WHEEL</text>
  <text x="250" y="323" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#F7F2E7">[8 · 16]</text>
  <circle cx="250" cy="300" r="6" fill="#F7F2E7" stroke="#201A15" stroke-width="1.5" opacity="0"/>
  <path d="M250,148 A152,152 0 0 1 289,157" fill="none" stroke="#201A15" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="250" y="138" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#201A15">outer step 22.5° · inner step 45°</text>

  <text x="250" y="468" text-anchor="middle" font-size="13" fill="#201A15">Fig. 4a — twenty-four pockets, two rings</text>
  <text x="250" y="486" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#201A15">radius picks the ring · rotation picks the slot</text>

  <!-- RIGHT PANEL -->
  <g>
    <rect x="470" y="150" width="420" height="140" fill="none" stroke="#201A15" stroke-width="1"/>
    <text x="486" y="174" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">LUMA, HELD</text>
    <g stroke="#201A15" stroke-width="0.75">
      <rect x="486" y="186" width="29" height="26" fill="#B98D7E"/><rect x="518" y="186" width="29" height="26" fill="#A89A6A"/><rect x="550" y="186" width="29" height="26" fill="#8FA06A"/><rect x="582" y="186" width="29" height="26" fill="#6FA080"/><rect x="614" y="186" width="29" height="26" fill="#6A98A0"/><rect x="646" y="186" width="29" height="26" fill="#7E88A8"/><rect x="678" y="186" width="29" height="26" fill="#9480A8"/><rect x="710" y="186" width="29" height="26" fill="#A87E94"/><rect x="742" y="186" width="29" height="26" fill="#B08080"/><rect x="774" y="186" width="29" height="26" fill="#9C8A72"/><rect x="806" y="186" width="29" height="26" fill="#87987E"/><rect x="838" y="186" width="29" height="26" fill="#7E9A90"/>
    </g>
    <text x="486" y="228" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">one pocket · brightness fixed · data rides chroma</text>
    <text x="486" y="252" font-size="12.5" font-style="italic" fill="#201A15">The mean of the palette returns the tone —</text>
    <text x="486" y="268" font-size="12.5" font-style="italic" fill="#201A15">the ring reads as the picture, pixel by pixel.</text>

    <rect x="470" y="306" width="420" height="150" fill="none" stroke="#201A15" stroke-width="1"/>
    <text x="486" y="330" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">EDITIONS, NOT REPRINTS</text>
    <text x="486" y="354" font-family="'Courier New', monospace" font-size="10.5" fill="#201A15">ROTATION — hundredths of a degree</text>
    <text x="486" y="370" font-family="'Courier New', monospace" font-size="10.5" fill="#201A15">≈ 19,700 wheels from the turn alone</text>
    <text x="486" y="394" font-family="'Courier New', monospace" font-size="10.5" fill="#201A15">BASE NUDGE — ±1 step re-sorts ~100% of 2²⁰</text>
    <text x="486" y="410" font-family="'Courier New', monospace" font-size="10.5" fill="#201A15">≈ 5.5 × 10¹⁵ pressings · ΔE &lt; 0.4</text>
    <text x="486" y="434" font-size="12.5" font-style="italic" fill="#201A15">The picture holds. The pressing changes.</text>
  </g>

  <text x="40" y="528" font-family="'Courier New', monospace" font-size="10" fill="#201A15">A pocket-width turn reproduces the press — anything less is a new record.</text>
  <text x="920" y="528" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#201A15">№ BN–IV</text>
</svg>
