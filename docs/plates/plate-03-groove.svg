<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24,0 H0 V24" fill="none" stroke="#201A15" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <pattern id="hatch3" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#201A15" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8955A"/>
      <stop offset="55%" stop-color="#C9725A"/>
      <stop offset="100%" stop-color="#7E5A6E"/>
    </linearGradient>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#9F9F9F"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#201A15"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#F7F2E7"/>
  <rect x="0" y="0" width="960" height="560" fill="url(#grid3)"/>
  <rect x="8" y="8" width="944" height="544" fill="none" stroke="#201A15" stroke-width="2"/>
  <rect x="16" y="16" width="928" height="528" fill="none" stroke="#201A15" stroke-width="0.75"/>

  <text x="40" y="54" font-family="'Courier New', monospace" font-size="12" letter-spacing="4" fill="#201A15">PLATE III</text>
  <text x="40" y="82" font-size="26" fill="#201A15">RIM TO LABEL, ONE GROOVE</text>
  <text x="920" y="54" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#201A15">THE CUT · SIDE ELEVATION</text>
  <line x1="40" y1="94" x2="920" y2="94" stroke="#201A15" stroke-width="0.75"/>
  <text x="40" y="114" font-size="14" font-style="italic" fill="#201A15">One continuous groove runs from rim to label. The deadwax continues at the programme exit angle. The groove ends in a locked ring.</text>

  <!-- stylus travel arrow -->
  <line x1="80" y1="140" x2="880" y2="140" stroke="#201A15" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="480" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">TRAVEL OF THE STYLUS</text>

  <!-- radius ticks -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#201A15">
    <line x1="80" y1="150" x2="80" y2="168" stroke="#201A15" stroke-width="1"/><text x="80" y="162" text-anchor="middle" dy="-14">r_outer</text>
    <line x1="190" y1="150" x2="190" y2="168" stroke="#201A15" stroke-width="1"/><text x="190" y="162" text-anchor="middle" dy="-14">payload_outer</text>
    <line x1="490" y1="150" x2="490" y2="168" stroke="#201A15" stroke-width="1"/><text x="490" y="162" text-anchor="middle" dy="-14">cut_inner</text>
    <line x1="580" y1="150" x2="580" y2="168" stroke="#201A15" stroke-width="1"/><text x="580" y="162" text-anchor="middle" dy="-14">entry</text>
    <line x1="770" y1="150" x2="770" y2="168" stroke="#201A15" stroke-width="1"/><text x="770" y="162" text-anchor="middle" dy="-14">lock</text>
    <line x1="810" y1="150" x2="810" y2="168" stroke="#201A15" stroke-width="1"/><text x="845" y="162" text-anchor="middle" dy="-14">label_radius</text>
  </g>

  <!-- band strip: 80..880 -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#201A15">
    <rect x="80" y="170" width="40" height="120" fill="url(#hatch3)" stroke="#201A15" stroke-width="1.25"/>
    <text x="100" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#201A15" transform="rotate(-90 100 240)">RIM · FLAT</text>

    <rect x="120" y="170" width="70" height="120" fill="#8F8F8F" stroke="#201A15" stroke-width="1.25"/>
    <g stroke="#3A3A3A" stroke-width="1">
      <line x1="128" y1="170" x2="128" y2="180"/><line x1="136" y1="170" x2="136" y2="180"/><line x1="144" y1="170" x2="144" y2="180"/><line x1="152" y1="170" x2="152" y2="180"/><line x1="160" y1="170" x2="160" y2="180"/><line x1="168" y1="170" x2="168" y2="180"/><line x1="176" y1="170" x2="176" y2="180"/><line x1="184" y1="170" x2="184" y2="180"/>
    </g>
    <text x="155" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#111">LEAD-IN</text>
    <text x="155" y="232" text-anchor="middle">2 turns</text>
    <text x="155" y="245" text-anchor="middle">grey 96–159</text>
    <text x="155" y="258" text-anchor="middle">6 bits/px</text>

    <rect x="190" y="170" width="300" height="120" fill="url(#prog)" stroke="#201A15" stroke-width="1.25"/>
    <text x="340" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1E140F">PROGRAMME</text>
    <text x="340" y="230" text-anchor="middle" font-size="10" fill="#1E140F">the audio · laid from the rim</text>
    <text x="340" y="245" text-anchor="middle" font-size="10" fill="#1E140F">281 → 115 px · pitch = b</text>

    <rect x="490" y="170" width="90" height="120" fill="url(#prog)" opacity="0.92" stroke="#201A15" stroke-width="1.25"/>
    <rect x="490" y="170" width="90" height="120" fill="#F7F2E7" opacity="0.25"/>
    <text x="535" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1E140F">DEADWAX</text>
    <text x="535" y="230" text-anchor="middle" font-size="8.5" fill="#1E140F">life-size</text>
    <text x="535" y="242" text-anchor="middle" font-size="8.5" fill="#1E140F">1 mm/turn</text>
    <text x="535" y="254" text-anchor="middle" font-size="8.5" fill="#1E140F">≤ 6 turns</text>

    <rect x="580" y="170" width="190" height="120" fill="#B98D6B" stroke="#201A15" stroke-width="1.25"/>
    <g fill="none" stroke="#5A3D28" stroke-width="1.5">
      <path d="M600,170 V290"/><path d="M632,170 V290"/><path d="M678,170 V290"/><path d="M740,170 V290"/>
    </g>
    <text x="675" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#241708">RUN-OUT</text>
    <text x="675" y="230" text-anchor="middle" font-size="9" fill="#241708">3.2 → 5 mm · ×1.5 per ring</text>
    <text x="675" y="245" text-anchor="middle" font-size="9" fill="#241708">count derived · no count on wire</text>

    <rect x="770" y="170" width="40" height="120" fill="#2A2118" stroke="#201A15" stroke-width="1.25"/>
    <text x="790" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#F7F2E7" transform="rotate(-90 790 240)">LOCK · 1 TURN</text>

    <rect x="810" y="170" width="70" height="120" fill="#173F3C" stroke="#201A15" stroke-width="1.25"/>
    <text x="845" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#F7F2E7" transform="rotate(-90 845 240)">LABEL</text>
  </g>

  <!-- lower notes -->
  <g>
    <rect x="80" y="322" width="250" height="150" fill="none" stroke="#201A15" stroke-width="1"/>
    <text x="96" y="346" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">LEAD-IN</text>
    <rect x="96" y="358" width="218" height="26" fill="url(#ladder)" stroke="#201A15" stroke-width="1"/>
    <text x="96" y="398" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">64 rungs · 96–159 · mid-range</text>
    <text x="96" y="412" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">six bits to a pixel</text>
    <text x="96" y="434" font-size="12" font-style="italic" fill="#201A15">Holds the full BRD1.</text>
    <text x="96" y="450" font-size="12" font-style="italic" fill="#201A15">Off-ladder pixels do not decode.</text>

    <rect x="355" y="322" width="250" height="150" fill="none" stroke="#201A15" stroke-width="1"/>
    <text x="371" y="346" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">DEADWAX</text>
    <text x="371" y="370" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">life-size · 1.00 mm per turn</text>
    <text x="371" y="384" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">header of at most 6 turns</text>
    <text x="371" y="398" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">cut in the record's own tone</text>
    <text x="371" y="434" font-size="12" font-style="italic" fill="#201A15">Addressable and reproducible</text>
    <text x="371" y="450" font-size="12" font-style="italic" fill="#201A15">from the prefix. Holds no bytes.</text>

    <rect x="630" y="322" width="250" height="150" fill="none" stroke="#201A15" stroke-width="1"/>
    <text x="646" y="346" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#201A15">RUN-OUT + LOCK</text>
    <text x="646" y="370" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">one matte carrier · run-out + lock</text>
    <text x="646" y="384" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">fills lock → header · count derived</text>
    <text x="646" y="398" font-family="'Courier New', monospace" font-size="9.5" fill="#201A15">⅓ down a 12″ → 12 · to label → 1</text>
    <text x="646" y="434" font-size="12" font-style="italic" fill="#201A15">Holds 512 bytes on every</text>
    <text x="646" y="450" font-size="12" font-style="italic" fill="#201A15">profile, at every extent.</text>
  </g>

  <text x="40" y="528" font-family="'Courier New', monospace" font-size="10" fill="#201A15">Bands in order, widths not to scale.</text>
  <text x="920" y="528" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#201A15">№ BN–III</text>
</svg>
