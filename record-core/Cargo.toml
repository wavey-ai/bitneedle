[package]
name = "record-core"
version = "0.1.7"
edition = "2021"
description = "geometry and helpers for bitneedle picture records"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
  "alloc",
] }
encodec-rs = { version = "0.1.1", features = ["ecdc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
