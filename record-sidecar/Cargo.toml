[package]
name = "record-sidecar"
version = "0.1.8"
edition = "2021"
description = "bitneedle steganographic data carrier for sleeve extras"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license-file = "LICENSE"

[lib]
name = "record_sidecar"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
brotli = "7"
bytes2rgb = { version = "0.1.7", path = "../bytes2rgb" }
record-core = { version = "0.1.7", path = "../record-core" }
record-cut = { version = "0.1.7", path = "../record-cut" }
record-decode = { path = "../record-decode", version = "0.1.7" }
record-descriptor = { version = "0.1.7", path = "../record-descriptor" }
record-patternize = { version = "0.1.7", path = "../record-patternize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
getrandom = "0.3"
