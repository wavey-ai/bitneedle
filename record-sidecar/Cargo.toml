[package]
name = "record-sidecar"
version = "0.1.4"
edition = "2021"
description = "bitneedle steganographic data carrier for sleeve extras"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license = "Apache-2.0"

[lib]
name = "record_sidecar"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bytes2rgb = { path = "../bytes2rgb", version = "0.1.4" }
base64 = "0.22"
brotli = "7"
record-core = { path = "../record-core", version = "0.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
