[package]
name = "record-wasm"
version = "0.1.6"
edition = "2021"
description = "WebAssembly facade for Bitneedle record decoding, verification, and sidecar inspection."
repository = "https://github.com/wavey-ai/bitneedle"
license = "Apache-2.0"

[lib]
name = "bitneedle_record"
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
anyhow = "1"
base64 = "0.22.1"
console_error_panic_hook = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
record-core = { path = "../record-core", version = "0.1.6" }
record-decode = { path = "../record-decode", version = "0.1.6" }
record-descriptor = { path = "../record-descriptor", version = "0.1.6" }
record-package = { path = "../record-package", version = "0.1.0" }
record-sidecar = { path = "../record-sidecar", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
wasm-bindgen = "0.2"

[dev-dependencies]
record-cut = { path = "../record-cut", version = "0.1.6" }
record-render = { path = "../record-render", version = "0.1.6" }
