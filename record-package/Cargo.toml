[package]
name = "record-package"
version = "0.1.0"
edition = "2021"
description = "Optional BPK1 container for exact Bitneedle record components"
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
record-core = { path = "../record-core", version = "0.1.7" }
record-descriptor = { path = "../record-descriptor", version = "0.1.7" }
record-sidecar = { path = "../record-sidecar", version = "0.1.8" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
record-cut = { path = "../record-cut", version = "0.1.7" }
serde_json = "1"
