[package]
name = "record-cut-wasm"
version = "0.1.6"
edition = "2021"
description = "WebAssembly facade for Bitneedle record authoring: rendering, programme assembly, and record-label profile helpers."
repository = "https://github.com/wavey-ai/bitneedle"
readme = "README.md"
license-file = "LICENSE"

[lib]
name = "bitneedle_record_author"
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
base64 = "0.22.1"
anyhow = "1"
record-cut = { path = "../record-cut", version = "0.1.6" }
record-core = { path = "../record-core", version = "0.1.6" }
record-decode = { path = "../record-decode", version = "0.1.6" }
record-descriptor = { path = "../record-descriptor", version = "0.1.6" }
record-label = { path = "../record-label", version = "0.1.6" }
record-render = { path = "../record-render", version = "0.1.6" }
record-sidecar = { path = "../record-sidecar", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
