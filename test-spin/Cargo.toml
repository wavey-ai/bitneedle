[package]
name = "test-spin"
version = "0.1.7"
edition = "2021"
description = "Bitneedle record inspection/report CLI for testing and verification"
repository = "https://github.com/wavey-ai/bitneedle"
license = "Apache-2.0"

[[bin]]
name = "record-test"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
serde_json = "1"

record-core = { path = "../record-core", version = "0.1.7" }
record-descriptor = { path = "../record-descriptor", version = "0.1.7" }
record-decode = { path = "../record-decode", version = "0.1.7" }
record-sidecar = { path = "../record-sidecar", version = "0.1.7" }
encodec-rs = { path = "../../encodec-rs", version = "0.1.1", features = ["ecdc"] }
